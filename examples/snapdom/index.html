<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SnapDOM to JPEG XL</title>
<script type="importmap">
  {"imports": {"@zumer/snapdom": "https://cdn.jsdelivr.net/npm/@zumer/snapdom@3/dist/snapdom.mjs",
    "rapier-jxl/capture": "../../dist/capture.mjs", "rapier-jxl/upload": "../../dist/upload.mjs"}}
</script>
<div id="card" style="width:320px;padding:24px;background:#286447;color:#fff;font:20px system-ui">Hello, JPEG XL</div>
<button id="save">Save as JPEG XL</button>
<script type="module">
  import { snapdom } from '@zumer/snapdom';
  import { jxl } from './jxl.js';

  document.querySelector('#save').onclick = async () => {
    const result = await snapdom(document.querySelector('#card'), { plugins: [jxl()] });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(await result.toJxl());
    link.download = 'card.jxl';
    link.click();
  };
</script>
</html>
