<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapier JXL: encode to a score</title>
<style>
:root{color-scheme:light dark;--fg:#000;--bg:#fff;--box:#f0f0f0}
@media (prefers-color-scheme:dark){:root{--fg:#fff;--bg:#000;--box:#1c1c1c}}
body{font:16px/1.5 system-ui,sans-serif;color:var(--fg);background:var(--bg);max-width:48em;margin:2em auto;padding:0 16px}
label,select,input,button{font:inherit;color:inherit}
select,input[type=number]{background:var(--box);border:0;padding:.3em .5em}
input[type=number]{width:5em}
label{white-space:nowrap}
.drop{background:var(--box);padding:2em 1em;text-align:center;cursor:pointer;margin:1em 0}
.drop.over{outline:3px solid var(--fg)}
table{border-collapse:collapse;width:100%}td{padding:.25em .5em .25em 0;vertical-align:top}td:first-child{white-space:nowrap}
img{max-width:100%;display:block;margin:1em 0}
progress{width:100%}
</style>
<h1>Encode to a score</h1>
<p>Drop a photo. Rapier JXL finds the smallest JPEG XL file that meets the score, measuring each try on your GPU
(WebGPU). Nothing is uploaded.</p>
<p>
  <label>Score <select id="metric"><option value="ssimulacra2">SSIMULACRA2 at least</option><option value="butteraugli3">Butteraugli 3-norm at most</option></select></label>
  <input id="target" type="number" value="80" step="any" size="5" aria-label="Target">
  <label><input id="usegpu" type="checkbox" checked> WebGPU</label>
</p>
<div class="drop" id="drop" tabindex="0" role="button">Drop a photo here, or tap to choose one</div>
<input id="file" type="file" accept="image/*" hidden>
<progress id="progress" value="0" max="1" hidden></progress>
<table id="report"></table>
<img id="shown" alt="">
<script type="module">
import {encodeToScore, encodeToScoreSteps} from '../src/score.mjs';
const $ = id => document.getElementById(id), report = $('report'), progress = $('progress');
$('metric').addEventListener('change', () => { $('target').value = $('metric').value === 'ssimulacra2' ? 80 : 1; });
$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
$('drop').addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); if (e.dataTransfer.files[0]) run(e.dataTransfer.files[0]); });
$('file').addEventListener('change', () => { if ($('file').files[0]) run($('file').files[0]); });

async function device() {
  if (!$('usegpu').checked || !navigator.gpu) return null;
  // A fresh browser can answer null while the GPU starts: ask a few times.
  for (let i = 0; i < 8; i++) {
    const adapter = await navigator.gpu.requestAdapter({powerPreference: 'high-performance'});
    if (adapter) return {adapter, device: await adapter.requestDevice({requiredLimits: {maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize}})};
    await new Promise(r => setTimeout(r, 250));
  }
  return null;
}

const row = (name, value) => { const tr = report.insertRow(); tr.insertCell().textContent = name; tr.insertCell().textContent = value; };
const kb = n => (n / 1000).toLocaleString(undefined, {maximumFractionDigits: 1}) + ' KB';

async function run(file) {
  report.replaceChildren(); $('shown').removeAttribute('src');
  try {
    const bitmap = await createImageBitmap(file), {width, height} = bitmap;
    const canvas = new OffscreenCanvas(width, height), context = canvas.getContext('2d', {willReadFrequently: true});
    context.drawImage(bitmap, 0, 0); bitmap.close();
    const rgba = new Uint8Array(context.getImageData(0, 0, width, height).data.buffer);
    const target = {[$('metric').value]: Number($('target').value)}, gpu = await device();
    progress.hidden = false; progress.value = 0;
    const started = performance.now();
    let result;
    if (gpu) result = await encodeToScore(rgba, width, height, {target, gpu: gpu.device, onProgress: f => { progress.value = f; }});
    else {
      // On the CPU, as steps, so the page can show progress between them.
      const steps = encodeToScoreSteps(rgba, width, height, {target});
      let step;
      while (!(step = steps.next()).done) { progress.value = step.value; await new Promise(r => setTimeout(r)); }
      result = step.value;
    }
    const seconds = (performance.now() - started) / 1000;
    progress.hidden = true;
    row('Photo', `${file.name}, ${width} × ${height}, ${kb(file.size)}`);
    row('JPEG XL', `${kb(result.bytes.length)} (${(result.bytes.length * 100 / file.size).toFixed(0)}% of the original)`);
    row('Scores', (result.ssimulacra2 !== undefined ? `SSIMULACRA2 ${result.ssimulacra2.toFixed(2)}, ` : '') + `Butteraugli ${result.butteraugli.toFixed(3)}, 3-norm ${result.butteraugli3.toFixed(3)}`);
    row('Found', `quality ${result.quality.toFixed(1)}, ${result.candidate} candidate, ${seconds.toFixed(1)} s`);
    row('Measured on', gpu ? [gpu.adapter.info.vendor, gpu.adapter.info.architecture, gpu.adapter.info.description].filter(Boolean).join(' ') + (gpu.adapter.info.isFallbackAdapter ? ' (software)' : '') : 'the CPU');
    const url = URL.createObjectURL(new Blob([result.bytes], {type: 'image/jxl'}));
    $('shown').src = url;
    const tr = report.insertRow(); tr.insertCell();
    const a = tr.insertCell().appendChild(document.createElement('a'));
    a.href = url; a.download = file.name.replace(/\.[^.]+$/, '') + '.jxl'; a.textContent = 'Download the .jxl';
    gpu?.device.destroy();
  } catch (error) { progress.hidden = true; row('Error', (error.code ? error.code + ': ' : '') + error.message); }
}
</script>
