name: Job
description: Started a job from jobs/? Title the issue with the job's name, then attach its results file here.
title: ""
body:
  - type: markdown
    attributes:
      value: Use the job's name as the title, so others know it is taken. Results are unchecked until repeated. Include failures and partial results.
  - type: input
    id: job
    attributes:
      label: Job
      description: The job's name, as in jobs/README.md.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Results file
      description: Attach the results file (drag it here). Leave this empty until you have it.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything the file does not show, such as a display problem or an interruption.
