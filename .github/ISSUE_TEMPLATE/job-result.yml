name: Hardware check result
description: Send the JSON from a hardware check in jobs/.
title: "Hardware check: "
body:
  - type: markdown
    attributes:
      value: Results are unchecked until independently repeated. Include failures and partial results.
  - type: textarea
    id: result
    attributes:
      label: Result JSON
      description: Paste the complete output from Copy JSON.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything the result does not show, such as a display problem or interruption.
