# Safari native JPEG XL check for the staged rapier-jxl package on this branch only.
# Dual package: published 8.2.0 (package/) beside candidate (package-cand/) for product rows.
name: safari-check
on:
  push:
    branches: [ci/safari]
permissions:
  contents: read
concurrency:
  group: rapier-jxl-ci-safari
  cancel-in-progress: false
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: |
          sw_vers
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist
          node --version
      - name: Verify and extract staged packages
        run: |
          shasum -a 256 -c rapier-jxl-8.2.0.tgz.sha256
          shasum -a 256 -c rapier-jxl-candidate-b5374acbe.tgz.sha256
          tar -xzf rapier-jxl-candidate-b5374acbe.tgz
          mv package package-cand
          tar -xzf rapier-jxl-8.2.0.tgz
          test -f package/dist/index.mjs
          test -f package/dist/capture.mjs
          test -f package-cand/dist/index.mjs
          test -f package-cand/dist/codec.mjs
          cat PACKAGE.txt
      - name: Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Check
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          echo $! > server.pid
          nohup /usr/bin/safaridriver -p 4444 > driver.log 2>&1 &
          echo $! > driver.pid
          sleep 3
          PKG_VERSION="$(node -p "require('./package/package.json').version")+cand" node drive.mjs
          status=$?
          kill "$(cat server.pid)" "$(cat driver.pid)" 2>/dev/null || true
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: safari-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results.json
            server.log
            driver.log
          retention-days: 1
          if-no-files-found: warn
