# Safari native JPEG XL check for the staged rapier-jxl package, plus the SnapDOM jxl plug-in.
name: safari-check
on:
  push:
    branches: [ci/safari]
permissions:
  contents: read
concurrency:
  group: rapier-jxl-ci-safari
  cancel-in-progress: false
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: |
          sw_vers
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist
          node --version
      - name: Verify and extract staged package
        run: |
          shasum -a 256 -c rapier-jxl-8.2.0.tgz.sha256
          shasum -a 256 -c rapier-jxl-candidate.tgz.sha256
          mkdir -p p/820 p/cand
          tar -xzf rapier-jxl-8.2.0.tgz -C p/820
          tar -xzf rapier-jxl-candidate.tgz -C p/cand
          for p in 820 cand; do test -f p/$p/package/dist/index.mjs && test -f p/$p/package/dist/codec.mjs && test -f p/$p/package/dist/capture.worker.mjs; done
          cat PACKAGE.txt
      - name: Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Check
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          echo $! > server.pid
          nohup /usr/bin/safaridriver -p 4444 > driver.log 2>&1 &
          echo $! > driver.pid
          sleep 3
          PACKAGES_INFO="8.2.0 = published npm tarball; candidate = $(grep '^candidate' PACKAGE.txt | head -1)" node drive.mjs
          status=$?
          kill "$(cat server.pid)" "$(cat driver.pid)" 2>/dev/null || true
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: safari-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results.json
            server.log
            driver.log
          retention-days: 1
          if-no-files-found: warn

  safari-snapdom:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: |
          sw_vers
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist
          node --version
          cat snapdom/TIP.txt
      - name: Extract candidate package for SnapDOM
        run: |
          shasum -a 256 -c rapier-jxl-candidate.tgz.sha256
          mkdir -p p/cand
          tar -xzf rapier-jxl-candidate.tgz -C p/cand
          test -f p/cand/package/dist/capture-complete.worker.mjs
          mkdir -p snapdom/node_modules
          rm -rf snapdom/node_modules/rapier-jxl
          cp -R p/cand/package snapdom/node_modules/rapier-jxl
      - name: Install SnapDOM test deps
        working-directory: snapdom
        run: |
          # Install everything else, then put the checked tarball (rapier-jxl 8.3.2 from npm, PACKAGE.txt) in its place.
          node -e "const f='packages/plugins/package.json',p=require('./'+f);delete p.devDependencies['rapier-jxl'];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps --no-package-lock
          rm -rf node_modules/rapier-jxl
          cp -R ../p/cand/package node_modules/rapier-jxl
          node -e "console.log('rapier-jxl', require('./node_modules/rapier-jxl/package.json').version)"
          npx playwright install webkit
      - name: Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Plug-in + 32 demos on real Safari
        run: |
          SNAPDOM="$PWD/snapdom" RAPIER_JXL="$PWD/p/cand/package" nohup node snapdom-harness/server.mjs > snapdom-server.log 2>&1 &
          echo $! > snapdom-server.pid
          nohup /usr/bin/safaridriver -p 4444 > snapdom-driver.log 2>&1 &
          echo $! > snapdom-driver.pid
          sleep 3
          RAPIER_JXL="$PWD/p/cand/package" node snapdom-harness/drive-snapdom.mjs
          status=$?
          kill "$(cat snapdom-server.pid)" "$(cat snapdom-driver.pid)" 2>/dev/null || true
          exit $status
      - name: Lifecycle (Playwright WebKit on the Safari runner host)
        working-directory: snapdom
        env:
          BROWSER: webkit
        run: |
          # Real Safari covers plugin.jxl + demos above. Lifecycle needs vi.mock (vitest).
          # SnapDOM's own suite and its visual baselines run on the full Chromium/Firefox/WebKit beds, not here.
          echo "NOTE: Playwright WebKit ≠ Safari.app; real-Safari results are in snapdom-safari-results.json"
          node scripts/vitest.mjs run __tests__/plugin.jxl.lifecycle.test.js --browser.headless --reporter=dot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: safari-snapdom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            snapdom-safari-results.json
            snapdom-server.log
            snapdom-driver.log
          retention-days: 5
          if-no-files-found: warn
