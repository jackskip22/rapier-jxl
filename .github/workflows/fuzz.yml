# SPDX-License-Identifier: MIT
name: JPEG XL conformance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic mutation seed
        default: '20260930'
      jpegs:
        description: Structure-aware JPEG mutation budget
        default: '2000000'
      pixels:
        description: Pixel mutation budget (three encoder paths each)
        default: '32768'
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: npm install --ignore-scripts
      - name: Check the packed imports and the TypeScript consumer
        run: |
          npm run test:package
          npm run test:types
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: The same bytes under JavaScriptCore
        run: bun test --timeout 600000 ./test/bytes.test.mjs
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg build-essential cmake ninja-build
      - name: Read native libjxl 0.12.0 for source-precision conformance
        uses: actions/checkout@v4
        with:
          repository: libjxl/libjxl
          ref: a7a9c787341cf703dede03c2009fa460cae5e5df
          path: .native-jxl-source
      - name: Build the native source-precision oracle
        run: |
          git -C .native-jxl-source submodule update --init --depth 1 third_party/brotli third_party/highway third_party/skcms
          cmake -S .native-jxl-source -B .native-jxl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=ON \
            -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_DEVTOOLS=OFF -DJPEGXL_ENABLE_FUZZERS=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_JNI=OFF -DJPEGXL_ENABLE_SJPEG=OFF \
            -DJPEGXL_ENABLE_OPENEXR=OFF -DJPEGXL_ENABLE_SKCMS=ON -DJPEGXL_ENABLE_TCMALLOC=OFF
          cmake --build .native-jxl-build --target jxl --parallel 2
          cc -O2 -std=c11 -Wall -Wextra \
            -I .native-jxl-source/lib/include -I .native-jxl-build/lib/include \
            test/native-decoder.c -L .native-jxl-build/lib \
            -Wl,-rpath,"$PWD/.native-jxl-build/lib" -ljxl -o .native-jxl-build/rapier_oracle
          printf 'JXL_FUZZ_NATIVE=%s\n' "$PWD/.native-jxl-build/rapier_oracle" >> "$GITHUB_ENV"
          sha256sum .native-jxl-build/rapier_oracle .native-jxl-build/lib/libjxl.so.0.12.0
      - name: Read the optional jxl-rs 0.7.4 release source
        id: jxl_rs_source
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: libjxl/jxl-rs
          ref: 624ce908afcf8eb0dc2585a671535eaabb5d88cc
          path: .jxl-rs-source
      - name: Build optional jxl-rs with four explicit upstream owner repairs
        id: jxl_rs_build
        if: steps.jxl_rs_source.outcome == 'success'
        continue-on-error: true
        env:
          RAPIER_JXL_RS_REVISION: 624ce908afcf8eb0dc2585a671535eaabb5d88cc
          RAPIER_JXL_RS_PATCH: half-subnormals-squeeze-f16-output
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          # The unmodified pin has four retained decoder defects; see test/JXL-RS.md.
          sha256sum test/jxl-rs-*.patch
          for patch in "$PWD"/test/jxl-rs-*.patch; do
            git -C .jxl-rs-source apply "$patch"
          done
          mkdir -p .jxl-rs-source/jxl_cli/src/bin
          cp test/jxl-rs-decoder.rs .jxl-rs-source/jxl_cli/src/bin/rapier_oracle.rs
          cargo +1.98.1 build --locked --release --manifest-path .jxl-rs-source/Cargo.toml --bin jxl_cli --bin rapier_oracle
          printf 'JXL_FUZZ_JXL_RS=%s\n' "$PWD/.jxl-rs-source/target/release/rapier_oracle" >> "$GITHUB_ENV"
      - name: Report optional decoder availability
        if: always()
        run: |
          if [ -n "$JXL_FUZZ_JXL_RS" ]; then
            "$JXL_FUZZ_JXL_RS" --version
          else
            printf '%s\n' 'jxl-rs unavailable: third-oracle checks will be explicitly skipped.'
          fi
      - name: Decode returned streams with every available oracle
        env:
          JXL_FUZZ_REQUIRE_NATIVE: '1'
          JXL_FUZZ_SEED: ${{ inputs.seed || '20260930' }}
          JXL_FUZZ_JPEGS: '2048'
          JXL_FUZZ_PIXELS: '128'
          JXL_FUZZ_FAILURE_DIR: fuzz-failures
        run: node --test "test/*.test.mjs"
      - name: Fixed-budget scale run
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          JXL_SEED: ${{ inputs.seed || '20260930' }}
          JXL_JPEGS: ${{ inputs.jpegs || '2000000' }}
          JXL_PIXELS: ${{ inputs.pixels || '32768' }}
        run: node test/fuzz-shards.mjs --out fuzz-scale --workers 2 --seed "$JXL_SEED" --jpegs "$JXL_JPEGS" --pixels "$JXL_PIXELS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-scale-summary
          path: |
            fuzz-scale/summary.json
            fuzz-scale/plan.json
            fuzz-scale/shard-*/progress.json
            fuzz-scale/shard-*/difference-*
            fuzz-scale/shard-*/failure-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-reproduction
          path: fuzz-failures
          if-no-files-found: ignore
