name: snapdom-core
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SNAPDOM: 13b1f5c40dabdfa0ffbf4600d8aaa3c23f1f013f
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: SnapDOM as released at this commit
        run: |
          mkdir -p logs
          git init -q snapdom
          cd snapdom
          git fetch -q --depth 1 https://github.com/zumerlab/snapdom "$SNAPDOM"
          git checkout -q FETCH_HEAD
          set -o pipefail
          npm ci 2>&1 | tee ../logs/install-baseline.log
          npx playwright install --with-deps ${{ matrix.browser }} > ../logs/playwright-install.log 2>&1
      - name: The whole suite without the patches (baseline)
        working-directory: snapdom
        continue-on-error: true
        run: |
          set -o pipefail
          BROWSER=${{ matrix.browser }} node scripts/vitest.mjs run --browser.headless --reporter=dot 2>&1 | tee ../logs/suite-${{ matrix.browser }}-baseline.log
      - name: The patches
        working-directory: snapdom
        run: |
          set -o pipefail
          git -c user.name=ci -c user.email=ci@example.invalid am ../patches/*.patch 2>&1 | tee ../logs/am.log
          # A patch that changes package.json needs its lockfile refreshed; otherwise install exactly.
          if git diff --quiet "$SNAPDOM" HEAD -- package.json packages/plugins/package.json; then npm ci 2>&1 | tee ../logs/install.log
          else npm install --no-audit --no-fund 2>&1 | tee ../logs/install.log; fi
      - name: npm run check
        if: matrix.browser == 'chromium'
        working-directory: snapdom
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ../logs/check.log
      - name: The patches' own tests
        working-directory: snapdom
        run: |
          set -o pipefail
          files=$(git diff --name-only "$SNAPDOM" HEAD -- '__tests__/*.test.js')
          echo "$files"
          BROWSER=${{ matrix.browser }} npx vitest run $files --browser.headless --reporter=verbose 2>&1 | tee ../logs/patch-tests-${{ matrix.browser }}.log
      - name: The whole suite with the patches
        if: always()
        working-directory: snapdom
        continue-on-error: true
        run: |
          set -o pipefail
          BROWSER=${{ matrix.browser }} node scripts/vitest.mjs run --browser.headless --reporter=dot 2>&1 | tee ../logs/suite-${{ matrix.browser }}.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: logs-${{ matrix.browser }}
          path: logs/
          retention-days: 1
      - name: Failures with the patches against without, each new one run alone 10 times both ways
        if: always()
        run: |
          set -o pipefail
          node scripts/verdict.mjs logs/suite-${{ matrix.browser }}-baseline.log logs/suite-${{ matrix.browser }}.log ${{ matrix.browser }} snapdom "$SNAPDOM" | tee logs/compare-${{ matrix.browser }}.txt

  order:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      SNAPDOM: 13b1f5c40dabdfa0ffbf4600d8aaa3c23f1f013f
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: SnapDOM as released at this commit
        run: |
          mkdir -p logs
          git init -q snapdom
          cd snapdom
          git fetch -q --depth 1 https://github.com/zumerlab/snapdom "$SNAPDOM"
          git checkout -q FETCH_HEAD
          npm ci > ../logs/install.log 2>&1
          npx playwright install --with-deps ${{ matrix.browser }} > ../logs/playwright-install.log 2>&1
      - name: The whole suite without the patches
        working-directory: snapdom
        continue-on-error: true
        run: |
          set -o pipefail
          BROWSER=${{ matrix.browser }} node scripts/vitest.mjs run --browser.headless --reporter=dot 2>&1 | tee ../logs/order-${{ matrix.browser }}-baseline.log
      - name: The whole suite with the patches but without their test file
        working-directory: snapdom
        continue-on-error: true
        run: |
          set -o pipefail
          git -c user.name=ci -c user.email=ci@example.invalid am ../patches/*.patch > ../logs/am.log 2>&1
          for f in $(git diff --name-only --diff-filter=A "$SNAPDOM" HEAD -- '__tests__/*.test.js'); do rm "$f"; echo "removed $f"; done
          BROWSER=${{ matrix.browser }} node scripts/vitest.mjs run --browser.headless --reporter=dot 2>&1 | tee ../logs/order-${{ matrix.browser }}.log
      - name: Same failures by name?
        if: always()
        run: ORDER=1 node scripts/verdict.mjs logs/order-${{ matrix.browser }}-baseline.log logs/order-${{ matrix.browser }}.log ${{ matrix.browser }} snapdom "$SNAPDOM" | tee logs/order-${{ matrix.browser }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: logs-order-${{ matrix.browser }}
          path: logs/
          retention-days: 1
  flicker:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      SNAPDOM: 13b1f5c40dabdfa0ffbf4600d8aaa3c23f1f013f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: SnapDOM as released at this commit
        run: |
          mkdir -p logs
          git init -q snapdom
          cd snapdom
          git fetch -q --depth 1 https://github.com/zumerlab/snapdom "$SNAPDOM"
          git checkout -q FETCH_HEAD
          npm ci > ../logs/install.log 2>&1
          npx playwright install --with-deps ${{ matrix.browser }} > ../logs/playwright-install.log 2>&1
      - name: Each suspect test alone, ten times, without and with the patches
        working-directory: snapdom
        run: |
          set -o pipefail
          tests() { grep "^${{ matrix.browser }}|" ../scripts/flicker-tests.txt | cut -d'|' -f2-; }
          tests | bash ../scripts/flicker.sh ${{ matrix.browser }} without | tee ../logs/flicker-${{ matrix.browser }}.txt
          git -c user.name=ci -c user.email=ci@example.invalid am ../patches/*.patch > ../logs/am.log 2>&1
          if git diff --quiet "$SNAPDOM" HEAD -- package.json packages/plugins/package.json; then npm ci > /dev/null 2>&1; else npm install --no-audit --no-fund > /dev/null 2>&1; fi
          tests | bash ../scripts/flicker.sh ${{ matrix.browser }} with | tee -a ../logs/flicker-${{ matrix.browser }}.txt
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SNAPDOM: 13b1f5c40dabdfa0ffbf4600d8aaa3c23f1f013f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: SnapDOM with the core and plugin patches, the encoder from package/
        run: |
          set -o pipefail
          mkdir -p logs
          git init -q snapdom
          cd snapdom
          git fetch -q --depth 1 https://github.com/zumerlab/snapdom "$SNAPDOM"
          git checkout -q FETCH_HEAD
          git show "$SNAPDOM":packages/plugins/jxl.js > ../released-jxl.js
          git -c user.name=ci -c user.email=ci@example.invalid am ../patches/*.patch ../later/*.patch 2>&1 | tee ../logs/am.log
          npm install --no-audit --no-fund > ../logs/install.log 2>&1
          npm install --no-audit --no-fund --no-save ../package/jpegxl.tgz ../package/rapier-jxl.tgz >> ../logs/install.log 2>&1
          npx playwright install --with-deps ${{ matrix.browser }} > ../logs/playwright-install.log 2>&1
          mkdir -p __measure__
          cp ../plugin/photos/*.jpg __measure__/
          cp ../released-jxl.js __tests__/zz-jxl-released.js
          cp ../plugin/zz-measure.test.js __tests__/
      - name: The plugin's own tests with the patches
        working-directory: snapdom
        run: |
          set -o pipefail
          BROWSER=${{ matrix.browser }} npx vitest run __tests__/plugin.jxl.test.js __tests__/plugin.jxl.lifecycle.test.js __tests__/plugin.jxl.textOverPhoto.test.js --browser.headless --reporter=verbose 2>&1 | tee ../logs/plugin-tests-${{ matrix.browser }}.log
      - name: Released plugin against patched plugin on text over photographs
        if: always()
        working-directory: snapdom
        run: |
          set -o pipefail
          BROWSER=${{ matrix.browser }} npx vitest run __tests__/zz-measure.test.js --browser.headless --reporter=verbose 2>&1 | tee ../logs/measure-run-${{ matrix.browser }}.log
          cp measure-*.jsonl ../logs/
      - name: The table and N
        if: always()
        run: |
          set -o pipefail
          node scripts/measure-summary.mjs logs/measure-*.jsonl | tee logs/measure-table-${{ matrix.browser }}.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: logs-plugin-${{ matrix.browser }}
          path: logs/
          retention-days: 1
  bundlers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Playwright's Chromium
        run: |
          mkdir -p logs tools && cd tools
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.55.1 > ../logs/playwright-install.log 2>&1
          npx playwright install --with-deps chromium >> ../logs/playwright-install.log 2>&1
      - name: Both names in one Vite and one webpack app
        run: |
          set -o pipefail
          NODE_PATH=$PWD/tools/node_modules node bundlers/both-names.mjs package/jpegxl.tgz package/rapier-jxl.tgz --vite 7.3.8 --webpack 5.101.3 2>&1 | tee logs/bundlers.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: logs-bundlers
          path: logs/
          retention-days: 1
