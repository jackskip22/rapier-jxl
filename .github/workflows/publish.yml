name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: an npm that speaks trusted publishing (11.5.1 or newer)
        run: |
          npm install -g npm@11.21.0
          npm --version
          node -e 'const [a, b, c] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("trusted publishing needs npm 11.5.1 or newer"); process.exit(1); }'
      - name: publish unless the registry already has this version (trusted publishing through OIDC; no token, no secret)
        run: |
          set -u
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTHTOKEN 2>/dev/null || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; if [ -f "$npmrc" ]; then sed -i '/_authToken/d' "$npmrc"; fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on the registry: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npm publish --access public
          echo "published $name@$version" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: tag v<version> at its release commit and release it with the notes that commit's message carries
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          # The owner retired every version before 8.0.0: none is ever tagged or released again.
          [ "${version%%.*}" -ge 8 ] || { echo "$version is below 8.0.0: no release" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # The version just published can take minutes to appear on the registry (npm's scan held 8.3.0 about 25): wait up to 40.
          for try in $(seq 1 80); do [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] && break; [ "$try" = 80 ] || sleep 30; done
          if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then echo "$name@$version is not on the registry after 40 minutes: no release" >&2; exit 1; fi
          # The notes are the release commit's message body ("Rapier JXL <version>", then "## <version> (<date>)" and its lines).
          notes_file="$RUNNER_TEMP/notes.md"
          escaped=$(printf '%s' "$version" | sed 's/\./\\./g')
          release=$(git log -1 --format=%H -E --grep="^## $escaped( |\$)" "$SHA")
          if [ -z "$release" ]; then echo "no commit at or before $SHA carries the $version notes" >&2; exit 1; fi
          git log -1 --format=%B "$release" | awk -v v="$version" 'f && /^## /{exit} f{print} $0 == "## " v || index($0, "## " v " ") == 1 {f=1}' | sed -e '/./,$!d' > "$notes_file"
          if ! grep -q '[^[:space:]]' "$notes_file"; then echo "the $version notes are empty" >&2; exit 1; fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag "$tag" "$release"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" --verify-tag --title "$version" --notes-file "$notes_file" --latest
          echo "tagged $tag at $release and released $version" | tee -a "$GITHUB_STEP_SUMMARY"
