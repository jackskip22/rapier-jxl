name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: an npm that speaks trusted publishing (11.5.1 or newer)
        run: |
          npm install -g npm@11.21.0
          npm --version
          node -e 'const [a, b, c] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("trusted publishing needs npm 11.5.1 or newer"); process.exit(1); }'
      - name: publish unless the registry already has this version (trusted publishing through OIDC; no token, no secret)
        run: |
          set -u
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTHTOKEN 2>/dev/null || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; if [ -f "$npmrc" ]; then sed -i '/_authToken/d' "$npmrc"; fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on the registry: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npm publish --access public
          echo "published $name@$version" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: tag v<version> at its release commit and release it with the notes that commit's message carries
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          # The owner retired every version before 8.0.0: none is ever tagged or released again.
          [ "${version%%.*}" -ge 8 ] || { echo "$version is below 8.0.0: no release" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # The version just published can take minutes to appear on the registry (npm's scan held 8.3.0 about 25): wait up to 40.
          for try in $(seq 1 80); do [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] && break; [ "$try" = 80 ] || sleep 30; done
          if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then echo "$name@$version is not on the registry after 40 minutes: no release" >&2; exit 1; fi
          # The notes are the release commit's message body ("Rapier JXL <version>", then "## <version> (<date>)" and its lines).
          notes_file="$RUNNER_TEMP/notes.md"
          escaped=$(printf '%s' "$version" | sed 's/\./\\./g')
          release=$(git log -1 --format=%H -E --grep="^## $escaped( |\$)" "$SHA")
          if [ -z "$release" ]; then echo "no commit at or before $SHA carries the $version notes" >&2; exit 1; fi
          git log -1 --format=%B "$release" | awk -v v="$version" 'f && /^## /{exit} f{print} $0 == "## " v || index($0, "## " v " ") == 1 {f=1}' | sed -e '/./,$!d' > "$notes_file"
          if ! grep -q '[^[:space:]]' "$notes_file"; then echo "the $version notes are empty" >&2; exit 1; fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag "$tag" "$release"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" --verify-tag --title "$version" --notes-file "$notes_file" --latest
          echo "tagged $tag at $release and released $version" | tee -a "$GITHUB_STEP_SUMMARY"
  names:
    # The package under names/<name>/ (tools/jxl-names.mjs), after the root's: the same version under the name we share,
    # or the name that points to it. A first publish uses the owner's short-lived token once; every other is trusted.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: an npm that speaks trusted publishing (11.5.1 or newer)
        run: |
          npm install -g npm@11.21.0
          npm --version
      - name: what the names/ package needs (nothing, its first publish, or a trusted publish)
        id: name
        run: |
          set -eu
          count=$(ls -d names/*/ 2>/dev/null | wc -l)
          if [ "$count" = 0 ]; then echo "no names/ package in this tree" | tee -a "$GITHUB_STEP_SUMMARY"; echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$count" = 1 ] || { echo "names/ holds $count packages; one at a time" >&2; exit 1; }
          dir=$(ls -d names/*/); dir=${dir%/}
          root=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./$dir/package.json').name")
          [ "names/$name" = "$dir" ] || { echo "$dir holds $name" >&2; exit 1; }
          [ "$(node -p "require('./$dir/package.json').version")" = "$version" ] || { echo "$name is not at $root's version $version" >&2; exit 1; }
          node -e "const d = require('./$dir/package.json').dependencies; if (d && JSON.stringify(d) !== JSON.stringify({['$root']: '$version'})) { console.error('$name may depend only on $root $version exactly'); process.exit(1); }"
          [ -n "$(npm view "$root@$version" version 2>/dev/null)" ] || { echo "$root@$version is not on the registry" >&2; exit 1; }
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on the registry: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; mode=skip
          else
            case "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name")" in
              404) mode=first ;; 200) mode=trusted ;; *) echo "the registry did not say whether $name exists" >&2; exit 1 ;;
            esac
          fi
          { echo "mode=$mode"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"
      - name: publish it (trusted publishing through OIDC; no token, no secret)
        if: steps.name.outputs.mode == 'trusted'
        working-directory: ${{ steps.name.outputs.dir }}
        run: |
          set -eu
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTHTOKEN 2>/dev/null || true
          npm publish --access public --ignore-scripts
          echo "published $(node -p "require('./package.json').name + '@' + require('./package.json').version")" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: its first publish, with the owner's short-lived token (only while npm has never seen the name)
        if: steps.name.outputs.mode == 'first'
        working-directory: ${{ steps.name.outputs.dir }}
        env:
          FIRST_PUBLISH: ${{ secrets.NPM_FIRST_PUBLISH }}
        run: |
          set -eu
          [ -n "$FIRST_PUBLISH" ] || { echo "this name has never been published: the owner's first-publish token is not saved" >&2; exit 1; }
          printf '//registry.npmjs.org/:_authToken=${FIRST_PUBLISH}\n' > "$RUNNER_TEMP/first-publish.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/first-publish.npmrc" npm publish --access public --ignore-scripts --provenance
  vscode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: package the extension (one file for the Marketplace; the same extension named jxl-convert for Open VSX)
        id: vsix
        run: |
          set -eu
          [ -f integrations/vscode/package.json ] || { echo "no extension in this tree" | tee -a "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          cd integrations/vscode
          id=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies --out "$RUNNER_TEMP/extension.vsix"
          # A brand-new extension is not there: vsce prints "undefined" and no versions.
          known=$(npx --yes @vscode/vsce@4.1.0 show "$id" --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).versions.map(v=>v.version).join("\n"))}catch{}})' || true)
          if printf '%s\n' "$known" | grep -qxF "$version"; then new=false; else new=true; fi
          # Open VSX keeps a new extension in the rapier namespace inactive (the namespace is not claimed there). The
          # listing it shows is rapier.jxl-convert, so Open VSX gets this same extension under that name.
          cp package.json "$RUNNER_TEMP/package.json"
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("package.json","utf8"));p.name="jxl-convert";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies --out "$RUNNER_TEMP/extension.openvsx.vsix"
          cp "$RUNNER_TEMP/package.json" package.json
          publisher=${id%%.*}
          { echo "skip=false"; echo "id=$id"; echo "version=$version"; echo "marketplace=$new"; echo "vsix=$RUNNER_TEMP/extension.vsix"; echo "ovsxid=$publisher.jxl-convert"; echo "ovsx=$RUNNER_TEMP/extension.openvsx.vsix"; } >> "$GITHUB_OUTPUT"
      - name: publish to the Visual Studio Marketplace unless it has this version (trusted publishing through OIDC; no token)
        if: steps.vsix.outputs.skip == 'false'
        run: |
          set -eu
          if [ "${{ steps.vsix.outputs.marketplace }}" != "true" ]; then
            echo "${{ steps.vsix.outputs.id }}@${{ steps.vsix.outputs.version }} is already on the Marketplace: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npx --yes @vscode/vsce@4.1.0 publish --oidc --no-dependencies --packagePath "${{ steps.vsix.outputs.vsix }}"
          echo "published ${{ steps.vsix.outputs.id }}@${{ steps.vsix.outputs.version }} to the Marketplace" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: publish to Open VSX as rapier.jxl-convert (a token; trusted publishing once the namespace is owned)
        if: steps.vsix.outputs.skip == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -u
          namespace=${{ steps.vsix.outputs.ovsxid }}; name=${namespace#*.}; namespace=${namespace%%.*}
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$namespace/$name/${{ steps.vsix.outputs.version }}")" = 200 ]; then
            echo "${{ steps.vsix.outputs.ovsxid }}@${{ steps.vsix.outputs.version }} is already on Open VSX: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ -n "${OVSX_PAT:-}" ]; then
            set -e
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$namespace")" != 200 ]; then npx --yes ovsx@1.4.0 create-namespace "$namespace" -p "$OVSX_PAT"; fi
            npx --yes ovsx@1.4.0 publish "${{ steps.vsix.outputs.ovsx }}" -p "$OVSX_PAT"
          elif ! npx --yes ovsx@1.4.0 publish "${{ steps.vsix.outputs.ovsx }}" --trusted-publishing; then
            echo "Open VSX did not take ${{ steps.vsix.outputs.ovsxid }}@${{ steps.vsix.outputs.version }}: no OVSX_PAT, and no trusted publisher is registered for it yet. Skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "published ${{ steps.vsix.outputs.ovsxid }}@${{ steps.vsix.outputs.version }} to Open VSX" | tee -a "$GITHUB_STEP_SUMMARY"
