name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: the release names this version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          named=$(printf '%s' "$TAG" | grep -oE '[0-9]+.[0-9]+.[0-9]+' | head -1 || true)
          if [ -n "$named" ] && [ "$named" != "$version" ]; then
            echo "the release tag $TAG names $named, package.json says $version" >&2; exit 1
          fi
      - name: publish unless the registry already has this version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on the registry: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npm publish --provenance --access public
          echo "published $name@$version" | tee -a "$GITHUB_STEP_SUMMARY"
