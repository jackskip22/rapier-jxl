name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: an npm that speaks trusted publishing (11.5.1 or newer)
        run: |
          npm install -g npm@11.21.0
          npm --version
          node -e 'const [a, b, c] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("trusted publishing needs npm 11.5.1 or newer"); process.exit(1); }'
      - name: publish unless the registry already has this version (trusted publishing through OIDC; no token, no secret)
        run: |
          set -u
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTHTOKEN 2>/dev/null || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; if [ -f "$npmrc" ]; then sed -i '/_authToken/d' "$npmrc"; fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on the registry: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npm publish --access public
          echo "published $name@$version" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: tag every CHANGELOG.md version on the registry and release it with its section (the newest at this commit, older ones at the last commit that published them)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")
          notes() {
            node -e '
              const version = process.argv[1], lines = require("fs").readFileSync("CHANGELOG.md", "utf8").split("\n");
              const start = lines.findIndex(line => line.startsWith("## " + version + " ") || line === "## " + version);
              if (start < 0) { console.error("CHANGELOG.md has no section for " + version); process.exit(1); }
              const end = lines.findIndex((line, index) => index > start && line.startsWith("## "));
              process.stdout.write(lines.slice(start + 1, end < 0 ? undefined : end).join("\n").trim() + "\n");
            ' "$1"
          }
          for version in $(sed -n 's/^## \([0-9][0-9.]*[0-9]\)\( .*\)\{0,1\}$/\1/p' CHANGELOG.md | sort -V); do
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then echo "$name@$version is not on the registry: no tag" | tee -a "$GITHUB_STEP_SUMMARY"; continue; fi
            if [ "$version" = "$current" ]; then target="$GITHUB_SHA"
            else target=$(git log --format=%H --grep="^Rapier JXL $version\$" | head -n 1); fi
            if [ -z "$target" ]; then echo "no commit publishes $version: no tag" | tee -a "$GITHUB_STEP_SUMMARY"; continue; fi
            notes "$version" > "$RUNNER_TEMP/notes-$version.md"
            latest=false; [ "$version" = "$current" ] && latest=true
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then :
            elif git tag "$tag" "$target" && ! git push origin "refs/tags/$tag"; then
              # The workflow token cannot tag an older commit whose workflow file differs from today's; a lead tags it by hand.
              if [ "$version" = "$current" ]; then exit 1; fi
              echo "::warning::$tag at $target needs a tag pushed by hand (docs/RELEASING.md)"; continue
            fi
            gh release create "$tag" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes-$version.md" --latest=$latest
            echo "tagged $tag at $target and released $version" | tee -a "$GITHUB_STEP_SUMMARY"
          done
