name: tauri
on: [push, workflow_dispatch]
jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf xvfb dbus-x11 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked
      - name: Install
        working-directory: v7/examples/tauri
        run: npm ci
      - name: Package files
        working-directory: v7/examples/tauri
        shell: bash
        run: JXL_PACKAGE="$GITHUB_WORKSPACE/package" node prepare-assets.mjs && cat web-assets.json
      - name: Build the check build
        working-directory: v7/examples/tauri
        run: npm run build-check
      - name: Check on Linux
        if: runner.os == 'Linux'
        working-directory: v7/examples/tauri
        run: JXL_PACKAGE="$GITHUB_WORKSPACE/package" TAURI_APP="$PWD/src-tauri/target/debug/rapier-jxl-tauri-example" dbus-run-session -- xvfb-run -a npm run check
      - name: Check
        if: runner.os != 'Linux'
        working-directory: v7/examples/tauri
        shell: bash
        run: JXL_PACKAGE="$GITHUB_WORKSPACE/package" npm run check
      - name: Release size
        if: always()
        working-directory: v7/examples/tauri
        shell: bash
        run: npm run build && ls -l src-tauri/target/release/rapier-jxl-tauri-example*
